[project]
name = "talking-avatar"
version = "0.1.0"
description = "Inference runtime for the TalkingAvatar talking avatar model"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "accelerate>=1.10",
  "diffusers==0.37.1",
  "einops>=0.8",
  "ftfy>=6.3",
  "huggingface-hub>=1.24,<2",
  "hf-xet>=1.5,<2",
  "imageio[ffmpeg]>=2.37",
  "numpy>=1.26",
  "pillow>=11",
  "regex>=2024.11",
  "safetensors>=0.5",
  "scipy>=1.14",
  "sentencepiece>=0.2",
  "soundfile>=0.13",
  "torch>=2.7",
  "tqdm>=4.67",
  "transformers==5.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
